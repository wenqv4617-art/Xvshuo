# ============================================================
# Xvshuo 叙说 · APK 构建工作流
# 每次 push 到 main（或手动触发）在 ubuntu-latest 构建 release APK。
# 固定签名 keystore 入库一次（apac/keystore.jks + keystore.properties），
# 后续每次构建签名一致 → 可覆盖安装。
#
# 产物：app-release.apk（下载即 .apk，非 tar）。
# ============================================================
name: Build Xvshuo APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # v4 修复了 v3 的多行 packages 解析 bug（会把两个包名拼成一个参数传给 sdkmanager，
        # 导致 "Failed to find package 'platforms;android-34\nbuild-tools;34.0.0'"）。
        # v4 的 packages 为空格分隔，每个包单独调用一次 sdkmanager。
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle 8.2.1
        # 注意：Gradle 8.2.2 从未发布过（services.gradle.org 版本注册表与发行包均为 404），
        # 之前 setup-gradle 因此报 "Gradle version 8.2.2 does not exist"。
        # 8.2.1 为 8.2.x 线的真实版本，满足 AGP 8.2.2 的 Gradle >= 8.2 要求。
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Sync static files into assets/www
        shell: bash
        run: bash scripts/build-apk.sh sync

      - name: Build release APK
        shell: bash
        run: |
          gradle -p apac assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          exit ${PIPESTATUS[0]}

      - name: Surface build error (diagnostics)
        if: ${{ failure() }}
        shell: bash
        run: |
          grep -nE "What went wrong|Execution failed for task|Could not (get|resolve|find|download)|Caused by|FAILURE:|> " "$RUNNER_TEMP/gradle-build.log" 2>/dev/null | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          echo "::error::完整日志见 artifact gradle-build-log"

      - name: Upload build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Locate APK
        id: locate
        shell: bash
        run: |
          set -e
          APK=$(find apac/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK 路径: $APK"
          ls -la "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xvshuo-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
